# 发布到 npmjs.com —— 走 OIDC trusted publishing，不用任何长期 token。
#
# 为什么不用 NPM_TOKEN（2026-11-24 事故）：
#   本机 ~/.npmrc 里那把 classic token 在 11-22 还能发 0.5.5，11-24 起所有
#   需要鉴权的端点一律 401；npm 官方文档现在的口径是「2025-11 起只支持
#   granular token，legacy token 已移除」。更坑的是 npm CLI 在鉴权失败时会退回
#   匿名 PUT，scoped 包因此报 E404（"could not be found or you do not have
#   permission"）而不是 E401 —— 看起来像包不存在，实际是 token 死了。
#
# OIDC 用工作流自己的短时身份换发布凭据：没有 token 可泄露、没有 90 天轮换、
#   也不会再出现「发版前才发现 token 过期」。
#
# ✅ 2026-11-28 实测：OIDC 这条路是通的，trusted publisher 已配且能匹配。
#   GitHub 自 2026-07-15 起对新仓库强制 immutable subject claim：
#     sub = repo:T-splines@95456842/dsh-compaction-policy-engine@1459101306:ref:refs/tags/v0.5.15
#   2026-11-25 曾判定 npm registry 匹配不上这种 sub、一律回 "package not found"
#   （npm/cli#9969），并实测 GitHub 不让关 immutable（PUT …/oidc/customization/sub
#   返回 201 但 GET 仍是 true）。
#   2026-11-28 v0.5.15 的 Publish run 里，交换端点对同一个 immutable sub 返回
#   HTTP 201 + {"created","expires","token"} —— npm 侧已能匹配。那次仍然没自动发出去，
#   唯一原因是探测脚本只认 200，把 201 判成了失败（已修）。当时 0.5.15 用本机 token 手发。
#
#   0.5.15 之后：tag 一推，这个 workflow 自动接管 npm publish（OIDC，无长期 token）
#   和 GitHub Release。本机 token（Keychain npm-token-oss + scripts/npm-publish-keychain.sh）
#   只作兜底。注意 npm 的规则：trusted publisher 配置建好后须在 2 天内完成一次成功发布，
#   否则过期要重建（见下）。
#
# 一次性人工前置（等 npm 修复后才需要）：
#   npmjs.com → Packages → @magic6/dsh-compaction-policy-engine → Settings → Trusted publishing
#   Provider: GitHub Actions
#   Organization or user: T-splines
#   Repository:           dsh-compaction-policy-engine
#   Workflow filename:    publish.yml
#   Environment:          （留空）
#   ⚠ 配置建好后必须在 2 天内完成第一次成功发布，否则配置过期要重建。
#
# 发版流程：改 package.json version + CHANGELOG → commit → git tag vX.Y.Z → push tag。
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `write` 而不是 `read`：同一个工作流还要建 GitHub Release。
  # 这一点曾经漏掉，代价是本插件从 v0.5.6 到 v0.5.13 只发了 npm、没发 Release，
  # 而 dshmarket 是从 Release tag 读版本的 —— 页面上永远停在 v0.5.5※。
  # ※ 它会在没有 Release 时退化成从 commits 猜，于是显示 0.5.8。
  contents: write
  # ↓ 这一行是 OIDC 的全部秘密：允许工作流向 npm 证明「我是这个仓库的这个工作流」。
  id-token: write

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 让 npm 知道 registry；不要设置 token —— OIDC 路径要求完全无凭据。
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm CLI supports trusted publishing (>= 11.5.1)
        shell: bash
        run: |
          set -euo pipefail
          v="$(npm --version)"; echo "npm ${v}"
          node -e '
            const [maj, min] = process.argv[1].split(".").map(Number);
            if (maj < 11 || (maj === 11 && min < 5)) {
              console.error(`npm >= 11.5.1 required for trusted publishing, found ${process.argv[1]}`);
              process.exit(1);
            }
          ' "$v"

      - name: Verify OIDC endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint. Grant 'id-token: write' to this workflow."
            exit 1
          fi

      - name: Full test suite
        run: npm install --no-audit --no-fund && npm test

      - name: Check version consistency (tag == package.json == CHANGELOG top)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "${VERSION}" != "${TAG}" ]; then
              echo "::error::package.json version ${VERSION} does not match tag ${GITHUB_REF_NAME}"
              exit 1
            fi
          fi
          TOP="$(grep -m1 '^## \[' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')"
          if [ "${TOP}" != "${VERSION}" ]; then
            echo "::error::CHANGELOG top section (${TOP}) != package.json version (${VERSION})"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version ${VERSION} consistent"

      - name: Skip when this version is already on npmjs
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          # 发版时先用本机 token 发了、再推 tag 触发这里，是最常见的路径。
          # 那种情况下 OIDC 步骤必然失败（见文首关于 npm/cli#9969 的说明），
          # 但「这个版本已经发布了」不是失败 —— 直接跳过，别把发版记录染红。
          if npm view "${PKG}@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "already=true" >> "${GITHUB_OUTPUT}"
            echo "### npmjs 上已有 ${PKG}@${VERSION}，本次无需发布" >> "${GITHUB_STEP_SUMMARY}"
            echo "${PKG}@${VERSION} already published; nothing to do."
          else
            echo "already=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Probe the OIDC token exchange (fails loudly with the registry's own words)
        if: steps.exists.outputs.already != 'true'
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc-oidc
        run: |
          set -euo pipefail
          : > "${NPM_CONFIG_USERCONFIG}"
          echo "registry=https://registry.npmjs.org/" >> "${NPM_CONFIG_USERCONFIG}"

          # 直接打 npm 用来换 publishing token 的那个端点，把 registry 的原话打出来。
          # 比反复猜「ENEEDAUTH 是 id-token 权限还是 trusted publisher 没配」快得多：
          # 这个端点 404/401 => 包里没有匹配的 trusted publisher；2xx + token（实测 201）=> 配置是对的。
          PKG="$(node -p "require('./package.json').name")"
          # 用 npm 自己的转义规则（npa.escapedName），不要手搓 encodeURIComponent：
          # npa 产出小写 %2f，手搓是大写 %2F。路由大小写敏感时这个差别会伪装成
          # 「package not found」，把人骗去重配 trusted publisher。
          ESCAPED="$(npm exec --yes --silent --package=npm-package-arg -- node -e 'import("npm-package-arg").then(({default:npa})=>console.log(npa(process.argv[1]).escapedName))' "${PKG}" 2>/dev/null \
            || node -e 'console.log(process.argv[1].replace("/","%2f"))' "${PKG}")"
          echo "package=${PKG} escaped=${ESCAPED}"

          ID_TOKEN="$(curl -sS --fail "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')"
          if [ -z "${ID_TOKEN}" ]; then
            echo "::error::GitHub returned no OIDC id_token; check the 'id-token: write' permission."
            exit 1
          fi
          # 只打 claims，不打 token 本身。同时抛成 annotation：
          # GitHub 的 job log 要 admin 权限才能下载，annotation 才是外部可读的通道。
          CLAIMS="$(node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());console.log(JSON.stringify({aud:p.aud,sub:p.sub,repository:p.repository,ref:p.ref,job_workflow_ref:p.job_workflow_ref}))' "${ID_TOKEN}")"
          echo "oidc claims: ${CLAIMS}"
          echo "::warning::OIDC claims => ${CLAIMS}"
          echo "::warning::npm 侧必须与此一致：Organization or user=T-splines, Repository=dsh-compaction-policy-engine, Workflow filename=publish.yml, Environment=（留空）"

          # sub 是 npm 匹配 trusted publisher 时真正比对的 claim。
          # GitHub 自 2026-07-15 起对新仓库启用 immutable subject claim，
          # 形状从 repo:OWNER/REPO:... 变成 repo:OWNER@ID/REPO@ID:...。
          # npm registry 侧匹配不上就统一回 "package not found"（npm/cli#9969）。
          SUB_CHECK="$(node -e '
            const p = JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());
            const m = /^repo:([^/]+)\//.exec(p.sub || "");
            const immutable = !!m && m[1].includes("@");
            console.log(JSON.stringify({ sub: p.sub, immutable_subject: immutable }));
          ' "${ID_TOKEN}")"
          echo "sub claim: ${SUB_CHECK}"
          echo "::warning::sub claim => ${SUB_CHECK}"

          # 同时探另外两个包：如果它们 200 而本包 404，说明 trusted publisher 配到了
          # 别的包上（或本包的 workflow 文件名/环境对不上），一眼就能区分。
          # 含一个**确定没配** trusted publisher 的基线包（left-pad）：
          #   基线也是 404 => 「package not found」就是「没配置」的标准文案，本包确实没配上
          #   基线不是 404 => 我们的 404 另有含义，别急着让人重配
          for OTHER in "@magic6/dsh-llm-resilience" "@magic6/dsh-web-fallback-chain" "@magic6/dsh-compaction-policy-engine" "left-pad"; do
            ESC="${OTHER/@/%40}"
            ESC="${ESC/\//%2f}"
            CODE="$(curl -sS -o /tmp/x.json -w '%{http_code}' -X POST \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${ESC}" \
              -H "Authorization: Bearer ${ID_TOKEN}" || true)"
            echo "exchange probe ${OTHER} -> HTTP ${CODE} $(head -c 160 /tmp/x.json 2>/dev/null)"
            echo "::warning::OIDC exchange ${OTHER} -> HTTP ${CODE} $(head -c 160 /tmp/x.json 2>/dev/null)"
          done

          BODY_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "${BODY_FILE}" -w '%{http_code}' -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${ESCAPED}" \
            -H "Authorization: Bearer ${ID_TOKEN}" || true)"
          echo "exchange HTTP ${STATUS}"
          echo "exchange body: $(head -c 400 "${BODY_FILE}")"
          # 端点成功时回 201 Created（2026-11-28 实测：{"created":…,"token":…}），
          # 不是 200。此前只认 200，把成功判成失败，发布和 Release 一直被跳过。
          if [ "${STATUS}" != "200" ] && [ "${STATUS}" != "201" ]; then
            # 说清 404 的两种可能，别让人去重配一个本来就对的设置：
            # 本仓库建于 2026-11-15，GitHub 对新仓库强制 immutable subject claim，
            # sub = repo:T-splines@95456842/dsh-compaction-policy-engine@1459101202:ref:...
            # registry 侧匹配不上就统一回 "package not found"（npm/cli#9969，open，P1）。
            echo "::error::OIDC token exchange failed (HTTP ${STATUS}). npm says: $(head -c 300 "${BODY_FILE}") — 两种可能：① npm 侧没有 trusted publisher 记录；② 有记录但 sub claim 是 immutable 格式（本仓库建于 2026-07-15 之后，必然是这种），npm registry 匹配不上，见 npm/cli#9969。看上面 "sub claim => " 那行的 immutable_subject 字段即可区分。"
            exit 1
          fi
          node -e 'const b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log("exchange ok, token fields:", Object.keys(b).join(","))' "${BODY_FILE}"

      - name: Publish to npmjs (OIDC trusted publishing)
        if: steps.exists.outputs.already != 'true'
        shell: bash
        env:
          # setup-node 会注入 NODE_AUTH_TOKEN；清掉它，强制 npm 走 OIDC。
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc-oidc
        run: |
          set -euo pipefail
          # 干净的 userconfig：只有 registry，没有任何凭据。
          : > "${NPM_CONFIG_USERCONFIG}"
          echo "registry=https://registry.npmjs.org/" >> "${NPM_CONFIG_USERCONFIG}"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN must not be set; trusted publishing requires OIDC."
            exit 1
          fi

          PKG="$(node -p "require('./package.json').name")"
          if npm view "${PKG}@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} already exists on npmjs; skipping."
            echo "### npmjs: version already exists" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # 失败时必须看得到 npm 的原话：403/404/ENEEDAUTH 对应完全不同的修法。
          set +e
          npm publish --access public --registry=https://registry.npmjs.org/ --loglevel verbose 2>&1 | tee /tmp/publish.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo "::group::npm publish diagnostics"
            echo "--- npm / node ---"
            npm --version; node --version
            echo "--- offline OIDC env present? ---"
            for v in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN NODE_AUTH_TOKEN NPM_TOKEN; do
              val="${!v:-}"
              if [ -n "${val}" ]; then echo "${v}: set (length ${#val})"; else echo "${v}: empty"; fi
            done
            echo "--- effective npm config (auth fields only) ---"
            npm config list 2>&1 | grep -iE 'registry|auth|token|userconfig' || true
            echo "--- registry view of the package ---"
            npm view "${PKG}" version --registry=https://registry.npmjs.org/ 2>&1 | tail -3
            echo "--- auth-ish lines from the publish log ---"
            grep -iE 'e40[0-9]|e403|eneedauth|otp|oidc|trusted|publish|not permitted|forbidden' /tmp/publish.log | tail -25 || true
            echo "::endgroup::"
            # 关键一行抛成 annotation：GitHub 的 log 下载要 admin 权限，但
            # check-run 的 annotation 是公开可读的 —— 这是唯一能从外部看到
            # 「npm 到底说了什么」的通道（2026-11-24 排障时踩到过）。
            KEY="$(grep -iE 'npm error|e40[0-9]|eneedauth|forbidden|not permitted' /tmp/publish.log | head -3 | tr '\n' ' ' | cut -c1-350)"
            echo "::error::npm publish failed (exit ${STATUS}): ${KEY:-no diagnostic line matched}"
            echo "### ❌ Publish failed with exit ${STATUS}" >> "${GITHUB_STEP_SUMMARY}"
            exit "${STATUS}"
          fi

          echo "### ✅ Published ${PKG}@${VERSION} to npmjs (OIDC, no token)" >> "${GITHUB_STEP_SUMMARY}"

      # ── GitHub Release ────────────────────────────────────────────────────
      #
      # 发完 npm 必须再发一个 Release，否则 dshmarket 永远看不到新版本。
      # market 的索引（awesome-dsh-plugin.com/updates.json）优先读 Release tag，
      # 没有 Release 时退化到从 commits 猜一个版本号 —— 结果是页面停在旧版，
      # 而 npm 上其实已经发了好几版。2026-11-26 排查时，页面显示 0.5.8
      # （从 commits 猜的），实际 npm 上已经是 0.5.14。
      #
      # 用 `gh release create` 而不是 REST 调用：它自带重试，且已经预装在
      # ubuntu-latest 上，不需要额外 token 之外的凭据。
      - name: Publish GitHub Release
        if: steps.exists.outputs.already != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 幂等：手动补发过 Release 时不要失败。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping."
            echo "### GitHub Release: already exists" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # 正文取 CHANGELOG 里这一版的小节；取不到就用最小可读信息，
          # 绝不让「没有 changelog」阻塞发版。
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          NOTES=/tmp/release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="${VERSION_NO_V}" '
              $0 ~ "^## \\[?v?" ver "\\]?([[:space:]]|$)" { hit=1; next }
              hit && /^## / { exit }
              hit { print }
            ' CHANGELOG.md > "${NOTES}"
          fi
          if [ ! -s "${NOTES}" ]; then
            {
              echo "npm: \`$(node -p "require('./package.json').name")@${VERSION_NO_V}\`"
              echo
              echo "> ⚠️ 升级后必须重启 DSH。热加载只覆盖配置，不覆盖代码 ——"
              echo "> 不重启时设置页显示新版本，跑的仍是旧代码。"
            } > "${NOTES}"
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES}"
          echo "### ✅ GitHub Release ${GITHUB_REF_NAME} created" >> "${GITHUB_STEP_SUMMARY}"
